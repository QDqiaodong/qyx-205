server:
  port: 0

spring:
  # H2 内存库（AUTO_SERVER 支持测试中多连接并发，验证库区开班行锁串行化）
  datasource:
    url: jdbc:h2:mem:coldchain_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      # 测试用 H2，表结构由 JPA ddl-auto 生成；生产 schema.sql 是 MySQL 方言（同名索引/函数索引），不在 H2 执行
      mode: never
  # 测试不连 Redis：交接班模块本身不使用 Redis，RedisTemplate 也是首次使用才懒连接
  data:
    redis:
      host: localhost
      port: 6370

logging:
  level:
    com.coldchain: warn
