server:
  port: ${SERVER_PORT:8135}

spring:
  datasource:
    url: jdbc:mysql://mysql:${MYSQL_PORT:3306}/coldchain_shelf?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  
  data:
    redis:
      host: redis
      port: ${REDIS_PORT:6379}
      timeout: 6000ms

logging:
  level:
    com.coldchain: DEBUG
    org.hibernate.SQL: DEBUG
